global
        log stdout format raw local0 info
        # haproxy 1.6 compiled default; kept explicit so the image upgrade
        # doesn't change how many connections one proxy pod accepts.
        maxconn 2000

defaults
        mode tcp
        log global
        option tcplog
        option dontlognull
        timeout connect 5s
        timeout queue 5s
        # Idle limit for a connection. Long on purpose: pooled DB clients sit
        # idle for hours, and dead peers are reaped by TCP keepalive below,
        # not by this timeout.
        timeout client 24h
        timeout server 24h
        # Kernel default keepalive starts after 2h idle — too late for
        # conntrack/NAT on the path. Probe after 60s, give up after ~1 min.
        option clitcpka
        clitcpka-idle 60s
        clitcpka-intvl 10s
        clitcpka-cnt 6
        option srvtcpka
        srvtcpka-idle 60s
        srvtcpka-intvl 10s
        srvtcpka-cnt 6

frontend frontend
        bind 0.0.0.0:"$BACKEND_PORT"
        default_backend backend

backend backend
        option log-health-checks
        option redispatch
        balance roundrobin
        server backend_host "$BACKEND_HOST":"$BACKEND_PORT" check inter 2s fall 3 rise 2
